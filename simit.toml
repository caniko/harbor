[ci]
platform = "github"
provider = "actions"
runtime = "nix"
publish_crates = true
publish_strategy = "members"

[ci.nix_system_runners]
x86_64-linux = "ubuntu-24.04"
aarch64-linux = "ubuntu-24.04-arm"
aarch64-darwin = "macos-15"

[monorepo]
schema_version = 1
# Components are git submodules; every generated checkout fetches them.
submodules = true

[[monorepo.components]]
id = "core"
paths = ["components/core"]
cargo_packages = ["harbor-evidence"]
checks = [
  # Builds the CI shell (Simit from source) once, outside the bounded checks.
  { id = "provision", run = "simit init ci --check", timeout_minutes = 60 },
  { id = "history", run = "python3 scripts/check_history.py" },
  { id = "userns-contracts", run = "python3 -B -m unittest discover -s scripts -p test_ci_userns.py", timeout_minutes = 5 },
  { id = "format", run = "treefmt --ci" },
  { id = "test", run = "cargo test --locked -p harbor-evidence --all-targets --jobs 2", timeout_minutes = 30 },
  { id = "clippy", run = "cargo clippy --locked -p harbor-evidence --all-targets --jobs 2 -- -D warnings", timeout_minutes = 30 },
  { id = "module-platforms", run = "for system in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do nix eval --raw .#checks.$system.harbor-modules.drvPath; done", timeout_minutes = 30 },
  { id = "nix", run = "nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-core", timeout_minutes = 90 },
]

[[monorepo.components]]
id = "rust"
paths = ["components/rust"]
# harbor-rs is its own Cargo workspace (excluded from the root workspace).
cargo_manifest = "components/rust/Cargo.toml"
cargo_packages = [
  "nix_harbor_rs",
  "harbor-cache",
  "caniko-harbor-sdk",
  "harbor-xtask",
  "harbor-sandbox",
]
depends_on = ["core", "android", "macos-sdk"]
systems = ["x86_64-linux", "aarch64-darwin"]
checks = [
  # Builds the CI shell (Simit from source) once, outside the bounded checks.
  { id = "provision", run = "simit init ci --check", timeout_minutes = 60 },
  # The root workspace (evidence, database, CAD, Zenodo) and harbor-rs's own
  # workspace are qualified separately. CAD's worker and DB's lifecycle engines
  # require Linux kernel/runtime APIs, so Darwin excludes them.
  { id = "userns", run = "python3 scripts/ci_userns.py", timeout_minutes = 5 },
  { id = "test", run = "set -- --features harbor-db/testing; if [ \"$(uname -s)\" = Darwin ]; then set -- --exclude harbor-cad --exclude harbor-db; fi; simit test --git-fixtures -- cargo test --locked --workspace \"$@\" --jobs 2 -- --test-threads=2", timeout_minutes = 30 },
  { id = "test-rust", run = "simit test --git-fixtures -- cargo test --locked --manifest-path components/rust/Cargo.toml --workspace --jobs 2 -- --test-threads=2", timeout_minutes = 30 },
  { id = "clippy", run = "set -- --features harbor-db/testing; if [ \"$(uname -s)\" = Darwin ]; then set -- --exclude harbor-cad --exclude harbor-db; fi; cargo clippy --locked --workspace \"$@\" --all-targets --jobs 2 -- -D warnings", timeout_minutes = 30 },
  { id = "clippy-rust", run = "cargo clippy --locked --manifest-path components/rust/Cargo.toml --workspace --all-targets --jobs 2 -- -D warnings", timeout_minutes = 30 },
  # Namespace acceptance applies to Linux; the Darwin lane still qualifies the
  # supported native Cargo members and component outputs above/below this gate.
  # Enter through the util-linux profile admitted by the userns gate; nested
  # Bubblewrap fixtures retain the global AppArmor restriction.
  { id = "sandbox-runtime", run = "bash -euc 'if [ \"$(uname -s)\" = Darwin ]; then echo \"Linux namespace runtime: not applicable on Darwin\"; exit 0; fi; test \"$(uname -s)\" = Linux; test \"${RUNNER_ENVIRONMENT:-}\" = github-hosted; exec nix develop --no-update-lock-file --max-jobs 1 --cores 2 .#rust-default --command unshare --user --map-root-user --mount --fork --kill-child cargo test --locked --manifest-path components/rust/Cargo.toml --jobs 2 -p harbor-sandbox --test runtime --test nested -- --ignored --test-threads=1'", timeout_minutes = 30 },
  { id = "nix", run = "nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-rust", timeout_minutes = 180 },
]

[[monorepo.components]]
id = "python"
paths = ["components/python"]
depends_on = ["core"]
checks = [
  # Builds the CI shell (Simit from source) once, outside the bounded checks.
  { id = "provision", run = "simit init ci --check", timeout_minutes = 60 },
  { id = "nix", run = "nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-python", timeout_minutes = 90 },
]

[[monorepo.components]]
id = "javascript"
paths = ["components/javascript"]
