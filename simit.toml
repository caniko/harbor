[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
workspace_strategy = "members"
required_gates = [
  { id = "harbor-ci", run = "nix develop -c harbor-ci default" },
]
publish_crates = true
platform = "github"
provider = "actions"
all_features = false
nix_builds = [
  ".#checks.x86_64-linux.upstream-binary-installation",
  ".#checks.x86_64-linux.upstream-binary-invalid-mappings",
  ".#checks.x86_64-linux.upstream-binary-invalid-payloads",
  ".#checks.x86_64-linux.upstream-binary-legacy-contract",
  ".#checks.x86_64-linux.upstream-binary-target-selection",
]

[ci.nix_build]
timeout_minutes = 30
max_parallel = 2
max_jobs = 1
cores = 2
capture_results = true
artifact_retention_days = 14

[ci.pages]
repo = "caniko/harbor-rs"
canonical_domain = "harbor-rs.tartanoglu.com"
site_output = "./site#site"
deploy_app = "./site#deploy-pages"

[release.github]
repo = "caniko/harbor-rs"
target_branch = "trunk"

[release.changelog]
auto_draft = true

[release.artifacts]
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
nix_bundle_attrs = ["release-bundle"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
version_attr = "harbor-rs"
build_commands = []
checksum_globs = ["*.tar.gz"]
minisign_pub = "keys/minisign.pub"
sign = true
