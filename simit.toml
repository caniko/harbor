[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
workspace_strategy = "members"
required_gates = [
  { id = "harbor-ci", run = "nix develop -c harbor-ci default" },
  { id = "sandbox-runtime", run = "bash -euc 'if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi; exec nix develop --no-update-lock-file -c cargo test --locked -p harbor-sandbox --test runtime --test nested -- --ignored --test-threads=1'" },
]
publish_crates = true
platform = "github"
provider = "actions"
all_features = false
nix_builds = [
  ".#packages.x86_64-linux.harbor-rs",
  ".#checks.x86_64-linux.dev-sandbox-contract",
]

[ci.nix_build]
timeout_minutes = 90
max_parallel = 2
max_jobs = 1
cores = 2
capture_results = true
artifact_retention_days = 14

[ci.pages]
repo = "caniko/harbor-rs"
canonical_domain = "harbor-rs.tartanoglu.com"
site_output = "./site#site"
deploy_app = "./site#deploy-pages"

[release.github]
repo = "caniko/harbor-rs"
target_branch = "trunk"

[release.changelog]
auto_draft = true

[release.artifacts]
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
nix_bundle_attrs = ["release-bundle"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
version_attr = "harbor-rs"
build_commands = []
checksum_globs = ["*.tar.gz"]
minisign_pub = "keys/minisign.pub"
sign = true
