[[monorepo.components]]
id = "database"
paths = ["components/database"]
cargo_packages = ["harbor-db"]
depends_on = ["rust"]
checks = [
  # Builds the CI shell (Simit from source) once, outside the bounded checks.
  { id = "provision", run = "simit init ci --check", timeout_minutes = 60 },
  { id = "userns", run = "python3 scripts/ci_userns.py", timeout_minutes = 5 },
  { id = "hosted-cache", run = "test \"${RUNNER_ENVIRONMENT:-}\" = github-hosted && test -r /dev/kvm && test -w /dev/kvm && sudo install -d -m 1777 -o root -g root /var/cache/sccache && test ! -L /var/cache/sccache && test \"$(stat -c '%u:%a' /var/cache/sccache)\" = 0:1777 && printf '%s\\n' 'extra-sandbox-paths = /var/cache/sccache' 'log-lines = 250' | sudo tee -a /etc/nix/nix.conf && sudo systemctl restart nix-daemon.service && nix config show sandbox-paths | grep -F /var/cache/sccache" },
  # Evaluate in a separate process: a single `nix build .#...` keeps its ~13 GiB
  # evaluation heap (every VM test's NixOS config) alive while the QEMU VMs run,
  # and the hosted runner's OOM killer took the runner down twice.
  { id = "nix", run = "nix build --no-link --max-jobs 1 --cores 2 $(nix path-info --derivation .#checks.x86_64-linux.component-database .#database-storage-lifecycle .#database-harbor-db-cached | sed 's/$/^*/')", timeout_minutes = 90 },
]

[[monorepo.components]]
id = "evm"
paths = ["components/evm"]
