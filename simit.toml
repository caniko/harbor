[[monorepo.components]]
id = "llm"
paths = ["components/llm"]
# harbor-llm is its own Cargo workspace (excluded from the root workspace).
cargo_manifest = "components/llm/Cargo.toml"
cargo_packages = [
  "harbor-llm-protocol",
  "harbor-llm-runtime",
  "harbor-llm-codegen",
]
releases = [
  { manifest = "components/llm/package.json", namespace = "harbor-llm", publish = false },
  { manifest = "components/llm/python/pyproject.toml", namespace = "harbor-llm-python", publish = false },
]
depends_on = ["core"]
checks = [
  # Builds the CI shell (Simit from source) once, outside the bounded checks.
  { id = "provision", run = "simit init ci --check", timeout_minutes = 60 },
  { id = "protocol-test", run = "cargo test --locked --manifest-path components/llm/Cargo.toml -p harbor-llm-protocol -p harbor-llm-runtime --jobs 2", timeout_minutes = 10 },
  { id = "protocol-clippy", run = "cargo clippy --locked --manifest-path components/llm/Cargo.toml -p harbor-llm-protocol -p harbor-llm-runtime -p harbor-llm-codegen --all-targets --jobs 2 -- -D warnings", timeout_minutes = 10 },
  { id = "protocol-generated", run = "cargo run --locked --manifest-path components/llm/Cargo.toml -p harbor-llm-codegen -- --check components/llm", timeout_minutes = 10 },
  { id = "nix", run = "nix build --no-link --max-jobs 1 --cores 2 .#checks.x86_64-linux.component-llm .#checks.x86_64-linux.llm-skills .#llm-default", timeout_minutes = 30 },
]

[[monorepo.components]]
id = "cad"
paths = ["components/cad"]
cargo_packages = ["harbor-cad"]
