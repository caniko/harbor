  { id = "nix", run = "nix build --no-link --max-jobs 1 --cores 2 .#checks.x86_64-linux.component-cad", timeout_minutes = 90 },
  { id = "blender-companion", run = "nix build --no-link --max-jobs 1 --cores 2 .#checks.x86_64-linux.blender-mcp-runtime", timeout_minutes = 90 },
  { id = "openpencil-companion", run = "nix build --print-build-logs --no-link --max-jobs 1 --cores 2 .#open-pencil-desktop .#checks.x86_64-linux.open-pencil-package-smoke .#checks.x86_64-linux.open-pencil-desktop-mcp", timeout_minutes = 180 },
]

[[monorepo.components]]
id = "projects"
paths = ["components/projects"]
depends_on = ["core"]
checks = [
  # Builds the CI shell (Simit from source) once, outside the bounded checks.
  { id = "provision", run = "simit init ci --check", timeout_minutes = 60 },
  { id = "nix", run = "nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-projects", timeout_minutes = 90 },
]

[[monorepo.components]]
id = "macos-sdk"
paths = ["components/macos-sdk"]
checks = [
  # Builds the CI shell (Simit from source) once, outside the bounded checks.
  { id = "provision", run = "simit init ci --check", timeout_minutes = 60 },
  { id = "pin", run = "nix eval --json .#lib.pins.macosSdk | jq -e '(.sdkVersion | test(\"^[0-9]+([.][0-9]+)+$\")) and (.outputHash | startswith(\"sha256-\")) and (.storePath | startswith(\"/nix/store/\")) and .attic.cacheName == \"harbor-macos-sdk\"'" },
]
