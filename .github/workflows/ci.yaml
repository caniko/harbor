# Generated by simit. Manual edits will be reported as ci=drift.
concurrency:
  cancel-in-progress: true
  group: monorepo-${{ github.event.pull_request.head.ref || github.ref_name }}
jobs:
  component-android:
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'android') }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
    - name: Configure public input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - name: Verify generated workflows
      run: nix develop --print-build-logs .#ci --command simit init ci --check
    - name: nix
      run: nix develop --print-build-logs .#ci --command simit monorepo check --component android --check nix --nix-diagnostics
      timeout-minutes: 90
    timeout-minutes: 360
  component-cad:
