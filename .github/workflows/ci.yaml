      name: test
      run: nix develop .#ci --command sh -ec 'simit test --git-fixtures -- cargo test --locked --workspace --jobs 2 -- --test-threads=2'
      timeout-minutes: 30
    - env: {}
      name: clippy
      run: nix develop .#ci --command sh -ec 'cargo clippy --locked --workspace --all-targets --jobs 2 -- -D warnings'
      timeout-minutes: 30
    - env: {}
      name: nix
      run: nix develop .#ci --command sh -ec 'nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-rust'
