        trap 'rm -f -- "$1/ready" "$1/ready.diagnostics-complete" || true; rmdir -- "$1" || true' EXIT
        set -- "$@" nix develop --print-build-logs .#ci --command simit monorepo check --component android --check nix --nix-diagnostics --gate-env provider-staged --deadline "$3" --supervisor-ready "$1/ready"
        if (
          set -- "$1/ready" "$3" "${@:4}"
        #!/usr/bin/env bash
        # Bound provisioning, including exec, until native deadline ownership.
