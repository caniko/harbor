      run: nix develop .#ci --command sh -ec 'nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-tex .#tex-anx-plugin-zenodo .#tex-anx-plugin-pandoc'
      timeout-minutes: 90
    timeout-minutes: 360
  plan:
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
    - name: Configure public input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - env:
        BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      id: plan
      name: Select affected components
      run: |
        set -euo pipefail
        if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
          nix develop .#ci --command simit monorepo plan --base "$BASE_REVISION" --json > plan.json
        else
          nix develop .#ci --command simit monorepo plan --json > plan.json
        fi
        selected=$(jq -c '.selected' plan.json)
        printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
        cat plan.json
      shell: bash
    timeout-minutes: 20
  qualified:
    if: ${{ always() }}
    needs:
    - plan
    - component-android
    - component-cad
    - component-core
    - component-database
    - component-evm
    - component-go
    - component-javascript
    - component-llm
    - component-macos-sdk
    - component-ntt
    - component-projects
    - component-python
    - component-rust
    - component-solana
    - component-tex
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        SELECTED: ${{ needs.plan.outputs.selected }}
      name: Require every selected component
      run: printf '%s' "$RESULTS" | jq -e --argjson selected "$SELECTED" '. as $jobs | $jobs.plan.result == "success" and all($selected[]; $jobs["component-" + .].result == "success")'
    timeout-minutes: 5
name: Monorepo qualification
on:
  pull_request: {}
  push:
    branches:
    - '**'
  workflow_dispatch: {}
permissions:
  contents: read
