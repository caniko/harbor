          if [ "$cancelled" -ne 0 ] || { [ ! -f "$ready" ] && [ "$SECONDS" -ge "$deadline" ]; }; then
            if [ "$cancelled" -ne 0 ]; then
              echo 'Nix provisioning cancelled' >&2
              status=$cancelled
            else
              echo 'Nix provisioning timed out' >&2
              status=124
            fi
            kill -TERM -- "-$pid" 2>/dev/null || true
            grace=5
            if [ -f "$ready" ]; then
              # Native owns its isolated gate and bounded cancellation diagnostics.
              grace=90
            fi
            limit=$((SECONDS + grace))
            while kill -0 "$pid" 2>/dev/null && [ "$SECONDS" -lt "$limit" ]; do
              sleep 0.05
            done
            exit "$status"
          fi
          sleep 0.05
        done
        if wait "$pid"; then
          status=0
        else
          status=$?
        fi
        exit "$status"

        ); then
          exit 0
        else
          set -- "$1" "$2" "$3" "$?"
        fi
        if [ ! -f "$1/ready.diagnostics-complete" ]; then
          (
            set -- "$2"
        printf '=== Nix failure diagnostics (check start @%s) ===\n' "$1" >&2
        if [ "$(uname -s)" != Linux ]; then
          printf '%s\n' 'Linux kernel/systemd diagnostics unavailable on this platform' >&2
          exit 0
        fi
        for path in /proc/meminfo /proc/pressure/memory; do
          printf '\n--- %s ---\n' "$path" >&2
          cat -- "$path" >&2 || true
        done
        capture() {
          printf '\n--- %s ---\n' "$1" >&2
          shift
          if timeout --kill-after=5s 15s sudo -n "$@" >&2; then
            printf 'status: 0\n' >&2
          else
            printf 'status: %s\n' "$?" >&2
          fi
        }
        capture 'Nix daemon status' systemctl show nix-daemon.service --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,MemoryCurrent,MemoryPeak,OOMPolicy
        capture 'Nix daemon journal' journalctl --unit=nix-daemon.service --since "@$1" --lines=150 --no-pager --output=short-iso
        capture 'Kernel journal' journalctl --dmesg --since "@$1" --lines=150 --no-pager --output=short-iso

          ) || true
        fi
        exit "$4"
      shell: bash
      timeout-minutes: 92
    timeout-minutes: 360
  plan:
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
    - name: Configure public input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - name: Verify generated workflows
      run: nix develop --print-build-logs .#ci --command simit init ci --check
    - env:
        BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      id: plan
      name: Select affected components
      run: |
        set -euo pipefail
        if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
          nix develop --print-build-logs .#ci --command simit monorepo plan --base "$BASE_REVISION" --json > plan.json
        else
          nix develop --print-build-logs .#ci --command simit monorepo plan --json > plan.json
        fi
        selected=$(jq -c '.selected' plan.json)
        printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
        cat plan.json
      shell: bash
    timeout-minutes: 20
  qualified:
    if: ${{ always() }}
    needs:
    - plan
    - component-android
    - component-cad
    - component-core
    - component-database
    - component-evm
    - component-game
    - component-go
    - component-javascript
    - component-llm
    - component-macos-sdk
    - component-ntt
    - component-projects
    - component-python
    - component-rust
    - component-solana
    - component-tex
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        SELECTED: ${{ needs.plan.outputs.selected }}
      name: Require every selected component
      run: printf '%s' "$RESULTS" | jq -e --argjson selected "$SELECTED" '. as $jobs | $jobs.plan.result == "success" and all($selected[]; $jobs["component-" + .].result == "success")'
    timeout-minutes: 5
name: Monorepo qualification
on:
  pull_request: {}
  push:
    branches:
    - '**'
  workflow_dispatch: {}
permissions:
  contents: read
