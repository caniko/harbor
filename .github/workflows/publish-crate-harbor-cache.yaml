      run: nix develop --print-build-logs .#ci --command simit init ci --check
    - env:
        BASE_REVISION: ''
      id: plan
      name: Select affected components
      run: |
        set -euo pipefail
        if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
          nix develop --print-build-logs .#ci --command simit monorepo plan --base "$BASE_REVISION" --json > plan.json
        else
          nix develop --print-build-logs .#ci --command simit monorepo plan --json > plan.json
        fi
        selected=$(jq -c '.selected' plan.json)
        printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
        cat plan.json
      shell: bash
    timeout-minutes: 20
  qualified:
    if: ${{ always() }}
    needs:
    - plan
    - component-android
    - component-cad
    - component-core
    - component-database
    - component-evm
    - component-go
    - component-javascript
    - component-llm
    - component-macos-sdk
    - component-ntt
    - component-projects
    - component-python
    - component-rust
    - component-solana
    - component-tex
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        SELECTED: ${{ needs.plan.outputs.selected }}
      name: Require every selected component
      run: printf '%s' "$RESULTS" | jq -e --argjson selected "$SELECTED" '. as $jobs | $jobs.plan.result == "success" and all($selected[]; $jobs["component-" + .].result == "success")'
    timeout-minutes: 5
name: Build Crate harbor-cache
on:
  push:
    tags:
    - harbor-cache/v[0-9]*
permissions:
  contents: read
