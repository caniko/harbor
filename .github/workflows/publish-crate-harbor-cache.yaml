# Generated by simit. Manual edits will be reported as ci=drift.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  build:
    env:
      CARGO_HOME: /tmp/.cargo
      NIX_CONFIG: experimental-features = nix-command flakes
      XDG_CACHE_HOME: /tmp/.cache
    needs:
    - qualified
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        submodules: recursive
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
    - name: Configure GitHub input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
    - env:
        GITHUB_TOKEN: ${{ github.token }}
      name: Validate signed release tag
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
        if [ -z "$tag" ]; then
          ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
          tag="${ref#refs/tags/}"
        fi

        case "$tag" in harbor-cache/v*) release_version="${tag#harbor-cache/v}" ;; *) echo 'Tag does not belong to this package' >&2; exit 1 ;; esac
        if ! printf '%s\n' "$release_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
          exit 1
        fi
        if ! command -v gpg >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends gnupg
          else
            echo "gpg is required to verify signed release tags" >&2
            exit 1
          fi
        fi
        git_fetch() {
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=$auth_header" fetch "$@"
          else
            git fetch "$@"
          fi
        }
        GNUPGHOME="$(mktemp -d)"
        export GNUPGHOME
        trap 'rm -rf "$GNUPGHOME"' EXIT
        chmod 700 "$GNUPGHOME"
        # The release checkout cannot supply its own verification key.
        # Fetch the repository's independently maintained default-branch key.
        git_fetch --no-tags origin HEAD
        git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
        test -s "$GNUPGHOME/maintainers.gpg"
        gpg --batch --import "$GNUPGHOME/maintainers.gpg"

        git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
        git verify-tag "$tag"
        signed_tag_name="$(git cat-file tag "refs/tags/$tag" | sed -n '1,/^$/s/^tag //p')"
        test "$signed_tag_name" = "$tag" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
        validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
        checkout_sha="$(git rev-parse --verify HEAD)"
        if [ "$validated_sha" != "$checkout_sha" ]; then
          echo "Signed tag commit does not match the checkout being published" >&2
          exit 1
        fi
    - name: Test harbor-cache
      run: nix develop -c cargo test --locked --manifest-path components/rust/Cargo.toml -p harbor-cache --all-targets --all-features
    - name: Clippy harbor-cache
      run: nix develop -c cargo clippy --locked --manifest-path components/rust/Cargo.toml -p harbor-cache --all-targets --all-features -- -D warnings
    - name: Package coordinated release set
      run: nix develop -c cargo package --locked --manifest-path components/rust/Cargo.toml --allow-dirty --no-verify -p harbor-cache --target-dir "$RUNNER_TEMP/simit-package-target"
    - name: Build immutable archive harbor-cache
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#harbor-cache/v}"
        test "$(nix develop -c cargo pkgid --locked --manifest-path components/rust/Cargo.toml -p harbor-cache | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
        mkdir -p "$RUNNER_TEMP/simit-crates/harbor-cache"
        cp "$RUNNER_TEMP/simit-package-target/package/harbor-cache-$version.crate" "$RUNNER_TEMP/simit-crates/harbor-cache/"
    - name: Retain original-run archive harbor-cache
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        if-no-files-found: error
        name: simit-crate-harbor-cache-${{ github.run_attempt }}
        path: ${{ runner.temp }}/simit-crates/harbor-cache/*.crate
        retention-days: 30
    timeout-minutes: 60
