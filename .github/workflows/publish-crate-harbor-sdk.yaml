  component-android:
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'android') }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
    - name: Configure public input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - name: Verify generated workflows
      run: nix develop --print-build-logs .#ci --command simit init ci --check
    - env: {}
      name: nix
      run: nix develop --print-build-logs .#ci --command sh -ec 'nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-android'
      timeout-minutes: 90
    timeout-minutes: 360
