    - name: Verify generated workflows
      run: nix develop --print-build-logs .#ci --command simit init ci --check
    - env: {}
      name: test
      run: nix develop --print-build-logs .#ci --command sh -ec 'simit test --git-fixtures -- cargo test --locked --workspace --jobs 2 -- --test-threads=2'
      timeout-minutes: 30
    - env: {}
      name: clippy
      run: nix develop --print-build-logs .#ci --command sh -ec 'cargo clippy --locked --workspace --all-targets --jobs 2 -- -D warnings'
      timeout-minutes: 30
    - env: {}
      name: sandbox-runtime
      run: 'nix develop --print-build-logs .#ci --command sh -ec ''bash -euc ''\''''if [ "$(uname -s)" = Darwin ]; then echo "Linux namespace runtime: not applicable on Darwin"; exit 0; fi; test "$(uname -s)" = Linux; test "${RUNNER_ENVIRONMENT:-}" = github-hosted; if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi; exec nix develop --no-update-lock-file --max-jobs 1 --cores 2 .#rust-default --command cargo test --locked --jobs 2 -p harbor-sandbox --test runtime --test nested -- --ignored --test-threads=1''\'''''''
      timeout-minutes: 30
    - env: {}
