    needs:
    - verify-source
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
    - name: Configure public input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - env:
        BASE_REVISION: ''
      id: plan
      name: Select affected components
      run: |
        set -euo pipefail
        if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
          nix develop --print-build-logs .#ci --command simit monorepo plan --base "$BASE_REVISION" --json > plan.json
        else
          nix develop --print-build-logs .#ci --command simit monorepo plan --json > plan.json
        fi
        selected=$(jq -c '.selected' plan.json)
        printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
        cat plan.json
      shell: bash
    timeout-minutes: 20
  qualified:
    if: ${{ always() }}
    needs:
    - plan
    - component-android
    - component-cad
    - component-core
    - component-database
    - component-evm
    - component-go
    - component-javascript
    - component-llm
    - component-macos-sdk
    - component-ntt
    - component-projects
    - component-python
    - component-rust
    - component-solana
    - component-tex
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        SELECTED: ${{ needs.plan.outputs.selected }}
      name: Require every selected component
      run: printf '%s' "$RESULTS" | jq -e --argjson selected "$SELECTED" '. as $jobs | $jobs.plan.result == "success" and all($selected[]; $jobs["component-" + .].result == "success")'
    timeout-minutes: 5
  verify-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Configure public input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - env:
        GITHUB_TOKEN: ${{ github.token }}
      name: Validate signed release tag
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
        if [ -z "$tag" ]; then
          ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
          tag="${ref#refs/tags/}"
        fi

        case "$tag" in nix_harbor_rs/v*) version="${tag#nix_harbor_rs/v}" ;; *) echo 'Tag does not belong to this package' >&2; exit 1 ;; esac
        if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then echo 'Invalid package release version' >&2; exit 1; fi

        if ! command -v gpg >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends gnupg
          else
            echo "gpg is required to verify signed release tags" >&2
            exit 1
          fi
        fi
        git_fetch() {
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=$auth_header" fetch "$@"
          else
            git fetch "$@"
          fi
        }
        GNUPGHOME="$(mktemp -d)"
        export GNUPGHOME
        trap 'rm -rf "$GNUPGHOME"' EXIT
        chmod 700 "$GNUPGHOME"
        # The release checkout cannot supply its own verification key.
        # Fetch the repository's independently maintained default-branch key.
        git_fetch --no-tags origin HEAD
        git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
        test -s "$GNUPGHOME/maintainers.gpg"
        gpg --batch --import "$GNUPGHOME/maintainers.gpg"

        git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
        git verify-tag "$tag"
        validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
        checkout_sha="$(git rev-parse --verify HEAD)"
        if [ "$validated_sha" != "$checkout_sha" ]; then
          echo "Signed tag commit does not match the checkout being published" >&2
          exit 1
        fi
    timeout-minutes: 15
name: Build Crate nix_harbor_rs
on:
  push:
    tags:
    - nix_harbor_rs/v[0-9]*
permissions:
  contents: read
