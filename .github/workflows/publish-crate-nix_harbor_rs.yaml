    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'rust') }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
    - name: Configure public input transport
      run: |
        git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
        git config --global --add url.https://github.com/.insteadOf git@github.com:
        git config --global --add url.https://codeberg.org/.insteadOf ssh://git@codeberg.org/
        git config --global --add url.https://codeberg.org/.insteadOf git@codeberg.org:
    - name: Verify generated workflows
      run: nix develop --print-build-logs .#ci --command simit init ci --check
    - name: userns
      run: |-
        # Expand the project command inside the Nix child shell.
        # shellcheck disable=SC2016
        nix develop --print-build-logs .#ci --command sh -ec 'python3 scripts/ci_userns.py'
      timeout-minutes: 5
    - name: test
      run: |-
        # Expand the project command inside the Nix child shell.
        # shellcheck disable=SC2016
        nix develop --print-build-logs .#ci --command sh -ec 'set --; if [ "$(uname -s)" = Darwin ]; then set -- --exclude harbor-cad --exclude harbor-db; fi; simit test --git-fixtures -- cargo test --locked --workspace "$@" --jobs 2 -- --test-threads=2'
      timeout-minutes: 30
    - name: clippy
      run: |-
        # Expand the project command inside the Nix child shell.
        # shellcheck disable=SC2016
        nix develop --print-build-logs .#ci --command sh -ec 'set --; if [ "$(uname -s)" = Darwin ]; then set -- --exclude harbor-cad --exclude harbor-db; fi; cargo clippy --locked --workspace "$@" --all-targets --jobs 2 -- -D warnings'
      timeout-minutes: 30
    - name: sandbox-runtime
      run: |-
        # Expand the project command inside the Nix child shell.
        # shellcheck disable=SC2016
        nix develop --print-build-logs .#ci --command sh -ec 'bash -euc '\''if [ "$(uname -s)" = Darwin ]; then echo "Linux namespace runtime: not applicable on Darwin"; exit 0; fi; test "$(uname -s)" = Linux; test "${RUNNER_ENVIRONMENT:-}" = github-hosted; exec nix develop --no-update-lock-file --max-jobs 1 --cores 2 .#rust-default --command unshare --user --map-root-user --mount --fork --kill-child cargo test --locked --jobs 2 -p harbor-sandbox --test runtime --test nested -- --ignored --test-threads=1'\'''
      timeout-minutes: 30
    - name: nix
      run: |-
        # Expand the project command inside the Nix child shell.
        # shellcheck disable=SC2016
        nix develop --print-build-logs .#ci --command sh -ec 'nix build --no-link --max-jobs 1 --cores 2 .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).component-rust'
      timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          system: x86_64-linux
        - runner: macos-15
          system: aarch64-darwin
      max-parallel: 2
    timeout-minutes: 360
  component-solana:
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'solana') }}
