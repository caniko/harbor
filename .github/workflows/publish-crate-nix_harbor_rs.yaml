    timeout-minutes: 360
  component-tex:
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'tex') }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
