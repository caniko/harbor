name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ codeberg.workflow }}-${{ codeberg.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Build Linux checks
        run: >-
          nix build --no-link --no-update-lock-file
          .#checks.x86_64-linux.profileSmoke
          .#checks.x86_64-linux.pdflatexSmoke
          .#checks.x86_64-linux.lualatexSmoke
          .#checks.x86_64-linux.xelatexSmoke
          .#checks.x86_64-linux.nestedWorkingDirectorySmoke
          .#checks.x86_64-linux.conferenceSmoke
