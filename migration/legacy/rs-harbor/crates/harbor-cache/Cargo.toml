[package]
name = "harbor-cache"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic Attic helpers for rs-harbor and downstream tooling"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
