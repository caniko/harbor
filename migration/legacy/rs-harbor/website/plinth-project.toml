[[pages.sections]]
type = "hero"
logo_src = "/rs-harbor-mark.svg"
title = "rs-harbor"
tagline = "Reusable Rust toolchain and cross-compilation infrastructure for Nix flakes."
subtitle = "Keep toolchains, cross targets, Cargo config generation, and packaging helpers in one flake library instead of rebuilding that plumbing in every Rust workspace."

[[pages.sections.ctas]]
label = "Read docs"
href = "/docs/"
primary = true

[[pages.sections.ctas]]
label = "View source"
href = "https://codeberg.org/caniko/rs-harbor"

[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Toolchains"
description = "Build nightly or stable Rust toolchains with crane already wired into the result."
highlight = true

[[pages.sections.features]]
title = "Cross targets"
description = "Generate native, Windows, and macOS cross environments from one flake library."

[[pages.sections.features]]
title = "Cargo config"
description = "Emit linker and compiler settings once, then let the dev shell write a consistent .cargo/config.toml."

[[pages.sections.features]]
title = "Packaging helpers"
description = "Ship AppImages, Flatpaks, Homebrew formulas, and other release artifacts without forking the build graph."
