[package]
name = "bevy-game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18"

# Optimize dependencies in dev for playable frame rates
[profile.dev.package."*"]
opt-level = 2

# Full optimizations for release
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
