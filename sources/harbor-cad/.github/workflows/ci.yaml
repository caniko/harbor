# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      UV_BIN: ".ci-bootstrap/bin/uv"
      UV_PYTHON: "3.13.15"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo bin (tools)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yaml') }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-all-crates: "true"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/trunk' }}

      - name: Project setup 1
        run: python3 -m venv .ci-bootstrap

      - name: Project setup 2
        run: .ci-bootstrap/bin/python -m pip install --require-hashes -r scripts/ci-bootstrap.txt

      - name: Project checks
        run: |
          python3 scripts/check_cpu.py
