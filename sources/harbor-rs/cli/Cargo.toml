[package]
name = "nix_harbor_rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Type-safe CLI for harbor-rs build helpers"

[[bin]]
name = "harbor-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
goblin = { version = "0.10", default-features = false, features = [
  "std",
  "elf64",
  "elf32",
  "pe64",
  "pe32",
  "mach64",
  "mach32",
  "te",
  "archive",
  "endian_fd",
] }
harbor-cache = { path = "../crates/harbor-cache" }
harbor-sdk = { path = "../crates/harbor-sdk" }
regex = "1"
sha2 = "0.10"
walkdir = "2"
which = "6"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints]
workspace = true
