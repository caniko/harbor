[workspace]
resolver = "3"
members = [
  "cli",
  "crates/harbor-sdk",
  "crates/harbor-cache",
  "crates/harbor-xtask",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/rs-harbor"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
