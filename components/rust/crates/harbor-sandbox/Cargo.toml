[package]
name = "harbor-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/harbor"
description = "Isolated Linux development previews and design variants"
readme = "README.md"
documentation = "https://docs.rs/harbor-sandbox"
keywords = ["linux", "sandbox", "nix", "development"]
categories = ["development-tools"]
include = [
  "src/**",
  "tests/**",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["-D", "warnings"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
