[package]
name = "harbor-cache"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/harbor"
description = "Generic Attic helpers for harbor-rs and downstream tooling"
readme = "README.md"
rust-version = "1.88"
documentation = "https://docs.rs/harbor-cache"
keywords = ["nix", "attic", "cache", "jwt"]
categories = ["development-tools::build-utils"]
include = [
  "src/**",
  "tests/**",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
