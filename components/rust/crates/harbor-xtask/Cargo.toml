[package]
name = "harbor-xtask"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/harbor"
description = "Reusable synchronous xtask helpers for Rust workspaces"

[dependencies]
anyhow = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tar = "0.4"
tempfile = "3"
toml = "0.8"
tracing = "0.1"
ureq = "3"
which = "6"

[lints]
workspace = true
