[package]
name = "anx-plugin-zenodo"
version = "0.1.0"
description = "Zenodo archival plugin for the anx article toolchain"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/caniko/harbor"
readme = "README.md"
documentation = "https://docs.rs/anx-plugin-zenodo"
keywords = ["zenodo", "archive", "doi", "publishing"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[[bin]]
name = "anx-plugin-zenodo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
miette = { version = "7", features = ["fancy"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dirs = "6"
base64 = "0.22"
rand = "0.8"
webbrowser = "1"

[lints]
workspace = true
