[project]
name = "polyglot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

# mkUvDevShell syncs `--group dev` on shell entry; ruff and basedpyright here
# are what editor extensions resolve from .venv.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "basedpyright>=1.30"]

[tool.uv]
package = false

[tool.basedpyright]
exclude = [".venv", "node_modules", "target"]
