[workspace]
resolver = "3"
members = [
  "components/core/crates/harbor-evidence",
  "components/database",
  "components/cad",
  "components/tex/plugins/zenodo",
]
exclude = [
  "migration/legacy/*",
  # Submodules with their own Cargo workspaces and lockfiles.
  "components/rust",
  "components/llm",
  "components/solana/templates/*",
]

# Versions and licenses belong to individual packages. Only shared lint policy
# is inherited; CAD retains its explicit GPL license and non-publication policy.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# CAD's execution identity checks hash complete binaries at every trust boundary.
# Optimize the digest engine in debug/test builds so software SHA-256 on hosted
# CPUs fits the same bounded test deadlines as hardware-accelerated local CPUs.
[profile.dev.package.sha2]
opt-level = 3
