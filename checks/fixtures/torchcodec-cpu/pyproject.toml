[project]
name = "torchcodec-cpu-regression"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["torch==2.9.0+cpu", "torchcodec==0.8.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
